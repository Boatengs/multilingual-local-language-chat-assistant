name: e2e
on:
  push:
    branches: [work]
    paths: [".github/requests/e2e.json"]
permissions:
  contents: write
env:
  GEN_URL: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
  JUDGE_URL: https://huggingface.co/bartowski/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.r.outputs.shards }}
      n: ${{ steps.r.outputs.n }}
      tag: ${{ steps.r.outputs.tag }}
      questions: ${{ steps.r.outputs.questions }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          f=.github/requests/e2e.json
          echo "shards=$(jq -c '[range(0; .shards)]' $f)" >> $GITHUB_OUTPUT
          echo "n=$(jq -r .shards $f)" >> $GITHUB_OUTPUT
          echo "tag=$(jq -r .tag $f)" >> $GITHUB_OUTPUT
          echo "questions=$(jq -r .questions $f)" >> $GITHUB_OUTPUT
  run:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.request.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" sentencepiece sacremoses protobuf sentence-transformers requests beautifulsoup4 lxml numpy pandas
      - uses: actions/cache@v4
        with:
          path: models
          key: gguf-llama32-3b-qwen25-14b
      - name: llama.cpp and models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models dl llamabin
          [ -f models/gen.gguf ] || curl -sSL -o models/gen.gguf "$GEN_URL"
          [ -f models/judge.gguf ] || curl -sSL -o models/judge.gguf "$JUDGE_URL"
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=100' --jq '[.[] | {tag: .tag_name, asset: ([.assets[].name | select(test("bin-ubuntu-x64\\.(zip|tar\\.gz)$"))][0])} | select(.asset != null)][0]' > rel.json
          cat rel.json
          gh release download "$(jq -r .tag rel.json)" -R ggml-org/llama.cpp --pattern "$(jq -r .asset rel.json)" -D dl
          cd dl && (tar xf *.tar.gz 2>/dev/null || unzip -q *.zip); cd ..
          cp -r "$(dirname "$(find dl -name llama-server -type f | head -1)")"/. llamabin/
      - name: Answer
        run: |
          export LD_LIBRARY_PATH=$PWD/llamabin:$LD_LIBRARY_PATH
          llamabin/llama-server -m models/gen.gguf -c 8192 -t 4 --port 8080 --log-disable > gen.log 2>&1 &
          PYTHONPATH=src python -m kasa.e2e answer --questions ${{ needs.request.outputs.questions }} --out out --shard ${{ matrix.shard }} --n-shards ${{ needs.request.outputs.n }}
          kill %1 || true
      - name: Grade
        run: |
          export LD_LIBRARY_PATH=$PWD/llamabin:$LD_LIBRARY_PATH
          llamabin/llama-server -m models/judge.gguf -c 8192 -t 4 --port 8081 --log-disable > judge.log 2>&1 &
          PYTHONPATH=src python -m kasa.e2e grade --answers out/answers_${{ matrix.shard }}.jsonl --out out
          kill %1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.shard }}
          path: out/
  collect:
    needs: [request, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: results/e2e_${{ needs.request.outputs.tag }}
          merge-multiple: true
      - name: Commit
        run: |
          git config user.name "Sam Boateng"
          git config user.email "32736261+Boatengs@users.noreply.github.com"
          git add results
          git commit -m "End to end answers: ${{ needs.request.outputs.tag }}"
          git pull --rebase origin work
          git push origin HEAD:work
