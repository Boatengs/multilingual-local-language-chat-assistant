name: data
on:
  push:
    branches: [work]
    paths: [".github/requests/data.json"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow huggingface_hub
      - run: PYTHONPATH=src python -m kasa.data --out data/mt
      - name: Commit
        run: |
          git config user.name "Sam Boateng"
          git config user.email "32736261+Boatengs@users.noreply.github.com"
          git add data
          git commit -m "Translation test sets"
          git pull --rebase origin work
          git push origin HEAD:work
