name: interim
on:
  push:
    branches: [work]
    paths: [".github/requests/interim.json"]
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow sacrebleu numpy
      - id: r
        run: echo "run=$(jq -r .run_id .github/requests/interim.json)" >> $GITHUB_OUTPUT; echo "tag=$(jq -r .tag .github/requests/interim.json)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          pattern: preds-*
          path: preds
          merge-multiple: true
          run-id: ${{ steps.r.outputs.run }}
          github-token: ${{ github.token }}
      - run: ls preds; PYTHONPATH=src python -m kasa.bench_mt report --data data/mt --preds preds --out results/mt_${{ steps.r.outputs.tag }}
      - name: Commit
        run: |
          git config user.name "Sam Boateng"
          git config user.email "32736261+Boatengs@users.noreply.github.com"
          git add results
          git commit -m "Interim translation scores"
          git pull --rebase origin work
          git push origin HEAD:work
