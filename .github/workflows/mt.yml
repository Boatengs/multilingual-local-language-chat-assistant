name: mt
on:
  push:
    branches: [work]
    paths: [".github/requests/mt.json"]
permissions:
  contents: write
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.r.outputs.models }}
      shards: ${{ steps.r.outputs.shards }}
      n: ${{ steps.r.outputs.n }}
      tag: ${{ steps.r.outputs.tag }}
      extra: ${{ steps.r.outputs.extra }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          f=.github/requests/mt.json
          echo "models=$(jq -c .models $f)" >> $GITHUB_OUTPUT
          echo "shards=$(jq -c '[range(0; .shards)]' $f)" >> $GITHUB_OUTPUT
          echo "n=$(jq -r .shards $f)" >> $GITHUB_OUTPUT
          echo "tag=$(jq -r .tag $f)" >> $GITHUB_OUTPUT
          echo "extra=$(jq -r '.extra_preds // ""' $f)" >> $GITHUB_OUTPUT
  run:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.request.outputs.models) }}
        shard: ${{ fromJson(needs.request.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" sentencepiece sacremoses protobuf pandas pyarrow sacrebleu
      - run: PYTHONPATH=src python -m kasa.bench_mt run --model ${{ matrix.model }} --data data/mt --out preds --shard ${{ matrix.shard }} --n-shards ${{ needs.request.outputs.n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preds-${{ matrix.model }}-${{ matrix.shard }}
          path: preds/
  report:
    needs: [request, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow sacrebleu numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: preds-*
          path: preds
          merge-multiple: true
      - run: PYTHONPATH=src python -m kasa.bench_mt report --data data/mt --preds preds --out results/mt_${{ needs.request.outputs.tag }} ${{ needs.request.outputs.extra && format('--extra-preds {0}', needs.request.outputs.extra) || '' }}
      - name: Commit
        run: |
          git config user.name "Sam Boateng"
          git config user.email "32736261+Boatengs@users.noreply.github.com"
          git add results
          git commit -m "Translation scores: ${{ needs.request.outputs.tag }}"
          git pull --rebase origin work
          git push origin HEAD:work
