[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "sacrebleu", "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
extend-exclude = ["probe"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
