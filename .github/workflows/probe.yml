name: probe
on:
  push:
    branches: [work]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub datasets
      - run: python probe/probe.py
      - run: bash probe/flores.sh
      - name: Commit
        run: |
          git config user.name "Sam Boateng"
          git config user.email "32736261+Boatengs@users.noreply.github.com"
          git add probe/out
          git commit -m "Probe candidate datasets"
          git pull --rebase origin work
          git push origin HEAD:work
